name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    # Do not run if is PR is from same repo as this repo i.e. not a fork
    # Only check this condition if the account starts with 'emteknetnz'
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.repo.owner.login, 'emteknetnz') || github.event.pull_request.head.repo.full_name != github.repository 
    uses: emteknetnz/gha-ci/.github/workflows/ci.yml@main
